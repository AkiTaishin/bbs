<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技術研修用掲示板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>秋谷ひな型掲示板</h1>
        
        <form id="postForm" class="post-form">
            <div class="form-group">
                <label for="username">名前：</label>
                <input type="text" id="username" required placeholder="名前を入力">
            </div>
            <div class="form-group">
                <label for="message">本文：</label>
                <textarea id="message" required placeholder="メッセージを入力"></textarea>
            </div>
            <button type="submit" id="submitBtn">投稿する</button>
        </form>

        <hr>

        <h2>投稿一覧</h2>
        <div id="postsContainer">
            <p class="loading">投稿を読み込み中...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
