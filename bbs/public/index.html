<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>研修用掲示板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-box">
        <h1>○○掲示板</h1>
        
        <form id="postForm">
            <div class="field">
                <label>名前</label>
                <input type="text" id="username" required>
            </div>
            <div class="field">
                <label>本文</label>
                <textarea id="message" required></textarea>
            </div>
            <button type="submit">投稿する</button>
        </form>

        <hr>

        <h2>投稿一覧</h2>
        <div id="postsContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
